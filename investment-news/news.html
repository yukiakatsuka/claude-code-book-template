<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>投資ニュース</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }

    header {
      position: sticky;
      top: 0;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      padding-top: max(14px, env(safe-area-inset-top));
    }

    .header-title { font-size: 18px; font-weight: 700; }
    .header-sub { font-size: 11px; color: #8b949e; margin-top: 2px; }

    #refresh-btn {
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #refresh-btn:disabled { opacity: 0.5; }
    #refresh-btn:active { opacity: 0.8; }

    #status-bar {
      padding: 6px 16px;
      font-size: 11px;
      color: #8b949e;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      min-height: 28px;
    }

    #error-bar {
      display: none;
      margin: 8px 12px;
      padding: 10px 14px;
      background: #2d1117;
      border: 1px solid #f85149;
      border-radius: 8px;
      color: #f85149;
      font-size: 13px;
    }

    #news-list { padding: 8px; }

    .loading {
      text-align: center;
      padding: 64px 16px;
      color: #8b949e;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty {
      text-align: center;
      padding: 64px 16px;
      color: #8b949e;
      font-size: 15px;
    }

    .news-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 8px;
      -webkit-tap-highlight-color: transparent;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .source-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      color: #fff;
      white-space: nowrap;
    }

    .pub-name {
      font-size: 11px;
      color: #8b949e;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .time-ago {
      font-size: 11px;
      color: #8b949e;
      white-space: nowrap;
    }

    .news-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 6px;
    }
    .news-title a {
      color: #e6edf3;
      text-decoration: none;
    }
    .news-title a:active { color: #58a6ff; }

    .news-desc {
      font-size: 13px;
      color: #8b949e;
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .keyword-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }
    .tag {
      font-size: 11px;
      background: #21262d;
      color: #58a6ff;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .section-header {
      font-size: 12px;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 8px 4px 4px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="header-title">📈 投資ニュース</div>
      <div class="header-sub">過去24時間の経済・市場ニュース</div>
    </div>
    <button id="refresh-btn" onclick="loadNews()">更新</button>
  </header>
  <div id="status-bar"></div>
  <div id="error-bar"></div>
  <div id="news-list">
    <div class="loading">
      <div class="spinner"></div>
      ニュースを取得中...
    </div>
  </div>
  <script src="news.js?v=5"></script>
</body>
</html>
